name: Get Server Info

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    env:
      VIBE_INFRA_KEY: ${{ secrets.VIBE_INFRA_KEY }}
      BASE: https://vibecode.bitrix24.tech/v1

    steps:
      - name: List all infra servers
        run: |
          echo "=== GET /v1/infra/servers ==="
          curl -s \
            -H "Authorization: Bearer $VIBE_INFRA_KEY" \
            "$BASE/infra/servers" | jq '.data[] | {id, displayName, subdomain, status, appUrl}' 2>/dev/null || \
          curl -s \
            -H "Authorization: Bearer $VIBE_INFRA_KEY" \
            "$BASE/infra/servers"
