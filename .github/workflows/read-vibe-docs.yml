name: Read Vibecode /v1/me docs

on:
  workflow_dispatch:

jobs:
  read-docs:
    runs-on: ubuntu-latest
    steps:
      - name: GET /v1/me with vibe_app_ key
        env:
          KEY_APP: vibe_app_local_6a315de3997341_60084050_huiUWiW2TaXFrjEaYDHJbVJ1OKn6F7ZsDJ3FMEXqCOC1W4XpJ2_eeb031
        run: |
          echo "=== GET /v1/me with vibe_app_ key (full response) ==="
          curl -s -H "X-Api-Key: $KEY_APP" https://vibecode.bitrix24.tech/v1/me

          echo ""
          echo "=== GET /v1/placements (available placements) ==="
          curl -s -H "X-Api-Key: $KEY_APP" https://vibecode.bitrix24.tech/v1/placements

          echo ""
          echo "=== GET /v1/guide (API guide) ==="
          curl -s -H "X-Api-Key: $KEY_APP" https://vibecode.bitrix24.tech/v1/guide | head -c 8000
