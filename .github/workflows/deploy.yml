name: Deploy to Vibecode

on:
  push:
    branches: [claude/pensive-johnson-gbemvh, claude/stoic-brahmagupta-1de51x, main]
  workflow_dispatch:

env:
  VIBE_INFRA_KEY: ${{ secrets.VIBE_INFRA_KEY || 'vibe_app_local_6a33e165084b01_16948434_JBjFVOfGL0oc8ohKjnjnpgr5P8hDTYhUlEIHctmdXg4fGYV3Tt_8ecffc' }}
  DEPLOY_URL:     https://vibecode.bitrix24.tech/v1/infra/servers/3a540f54-003c-407e-8e20-744142ee12be/deploy
  VIBE_API_URL:   https://vibecode.bitrix24.tech/v1
  APP_SERVER:     https://app-2afbe79d4d2e.vibecode.bitrix24.tech
  VIBE_APP_KEY:   ${{ secrets.VIBE_APP_KEY || 'vibe_app_local_6a33e165084b01_16948434_JBjFVOfGL0oc8ohKjnjnpgr5P8hDTYhUlEIHctmdXg4fGYV3Tt_8ecffc' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Deploy to Vibecode via /deploy API ────────────────────────────────
      - name: Deploy to Vibecode server
        id: deploy
        run: |
          SOURCE_URL="https://github.com/${{ github.repository }}/archive/refs/heads/${{ github.ref_name }}.tar.gz"
          echo "=== POST $DEPLOY_URL?stream=true ==="
          echo "Source: $SOURCE_URL"

          PAYLOAD=$(jq -n \
            --arg url "$SOURCE_URL" \
            --arg appKey "$VIBE_APP_KEY" \
            '{
              source: {url: $url},
              runtime: "node20",
              install: "cd B24-*/ && cd frontend && npm install && npm run build && cd ../backend && npm install && npm run build",
              start: "cd B24-*/ && node backend/dist/server.js",
              port: 3000,
              env: {NODE_ENV: "production", PORT: "3000", VIBE_APP_KEY: $appKey, BX24_DOMAIN: "credburo.bitrix24.ru"}
            }')

          # Stream build output — shows up live in Actions logs
          curl -s -w "\n__HTTP_CODE:%{http_code}__\n" -X POST \
            --max-time 300 \
            -H "Authorization: Bearer $VIBE_INFRA_KEY" \
            -H "X-Api-Key: $VIBE_INFRA_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DEPLOY_URL?stream=true" | tee /tmp/deploy_raw.txt

          CODE=$(grep "__HTTP_CODE:" /tmp/deploy_raw.txt | grep -oP '\d+' | tail -1 || echo "0")
          grep -v "__HTTP_CODE:" /tmp/deploy_raw.txt > /tmp/deploy.json || true

          echo "HTTP $CODE"
          echo "deploy_code=$CODE" >> $GITHUB_OUTPUT

          if [[ "$CODE" -ge 200 && "$CODE" -lt 300 ]]; then
            echo "deployed=true" >> $GITHUB_OUTPUT
            echo "::notice::Deploy request accepted (HTTP $CODE) — build running on Vibecode"
          else
            echo "deployed=false" >> $GITHUB_OUTPUT
            echo "::error::Deploy API HTTP $CODE"
            exit 1
          fi

      # ── Repair tunnel routing if needed ──────────────────────────────────
      - name: Repair tunnel routing
        if: always()
        run: |
          echo "=== POST repair ==="
          curl -s -X POST \
            -H "Authorization: Bearer $VIBE_INFRA_KEY" \
            -H "X-Api-Key: $VIBE_INFRA_KEY" \
            "https://vibecode.bitrix24.tech/v1/infra/servers/3a540f54-003c-407e-8e20-744142ee12be/repair" \
            | jq . 2>/dev/null || echo "repair call done"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          DEPLOYED:  ${{ steps.deploy.outputs.deployed }}
          HTTP_CODE: ${{ steps.deploy.outputs.deploy_code }}
        run: |
          echo "================================================================"
          echo "  ОРК Отчёты — Deploy Summary"
          echo "================================================================"
          echo "  Deploy status  : ${DEPLOYED:-false} (HTTP ${HTTP_CODE:-?})"
          echo "  App server     : $APP_SERVER"
          echo "================================================================"
          echo ""
          echo "Встройка в левое меню Битрикс24:"
          echo "  BX24.callMethod('placement.bind', {"
          echo "    PLACEMENT: 'APPLICATION_LEFT_MENU',"
          echo "    HANDLER:   '$APP_SERVER',"
          echo "    LANG_ALL:  { ru: { NAME: 'ОРК — Отчёты' } }"
          echo "  }, console.log);"
