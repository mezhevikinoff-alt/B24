name: Deploy to Vibecode

on:
  push:
    branches: [claude/stoic-brahmagupta-1de51x, main]
  workflow_dispatch:

env:
  VIBE_KEY: ${{ secrets.VIBE_API_KEY || 'vibe_api_wXJ94h3wA502Vmsw2ksXZTraKgElqItx_599bd9' }}
  VIBE_URL: https://vibecode.bitrix24.tech/v1
  APP_NAME: ork-reports
  KNOWN_APP_ID: b6e86834-8b84-42c4-be4b-2bd2b092aa91

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for GitHub Pages deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
        run: npm install && npm run build

      - name: Build backend
        working-directory: backend
        run: npm install && npm run build

      # ── Deploy frontend to GitHub Pages ───────────────────────────────────
      # The React app (static files) is served for free from GitHub Pages.
      # This gives us a stable https URL to set as appUrl in Vibecode.
      - name: Deploy frontend to GitHub Pages
        id: pages
        run: |
          REPO="${{ github.repository }}"
          BRANCH="gh-pages"
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

          # The frontend builds to backend/public/ — copy to a temp dir
          mkdir -p /tmp/gh-pages
          cp -r backend/public/. /tmp/gh-pages/

          # Configure git
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"

          # Push to gh-pages branch
          cd /tmp/gh-pages
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy ORK frontend to GitHub Pages"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/$REPO.git"
          git push origin gh-pages --force

          echo "pages_url=$PAGES_URL" >> $GITHUB_OUTPUT
          echo "::notice::GitHub Pages URL: $PAGES_URL"

      # ── Test: can Vibecode accept an external appUrl? ─────────────────────
      - name: Test PATCH appUrl on Vibecode
        id: patch_url
        env:
          APP_URL: ${{ steps.pages.outputs.pages_url }}
        run: |
          echo "=== Testing: PATCH /v1/apps/$KNOWN_APP_ID with appUrl ==="
          echo "appUrl to set: $APP_URL"

          # Try setting appUrl directly
          CODE=$(curl -s -w "%{http_code}" -X PATCH \
            -o /tmp/patch_appurl.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"appUrl\":\"$APP_URL\"}" \
            "$VIBE_URL/apps/$KNOWN_APP_ID")
          echo "PATCH appUrl → HTTP $CODE"
          cat /tmp/patch_appurl.json | jq . 2>/dev/null || cat /tmp/patch_appurl.json

          NEW_APP_URL=$(jq -r '.data.appUrl // empty' /tmp/patch_appurl.json 2>/dev/null \
            | grep -v '^null$' | head -1 || true)

          # Also try PUT
          CODE2=$(curl -s -w "%{http_code}" -X PUT \
            -o /tmp/put_appurl.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"appUrl\":\"$APP_URL\",\"title\":\"ORK Reports\",\"scopes\":[\"crm\",\"timeman\",\"user\",\"placement\"]}" \
            "$VIBE_URL/apps/$KNOWN_APP_ID")
          echo "PUT appUrl → HTTP $CODE2"
          cat /tmp/put_appurl.json | jq . 2>/dev/null || cat /tmp/put_appurl.json

          if [ -z "$NEW_APP_URL" ] || [ "$NEW_APP_URL" = "null" ]; then
            NEW_APP_URL=$(jq -r '.data.appUrl // empty' /tmp/put_appurl.json 2>/dev/null \
              | grep -v '^null$' | head -1 || true)
          fi

          echo "resolved_app_url=$NEW_APP_URL" >> $GITHUB_OUTPUT
          if [ -n "$NEW_APP_URL" ] && [ "$NEW_APP_URL" != "null" ]; then
            echo "::notice::appUrl successfully set: $NEW_APP_URL"
          else
            echo "::notice::appUrl still null — Vibecode may not support external URLs"
          fi

      # ── Get final app state ───────────────────────────────────────────────
      - name: Get final app state
        id: final
        run: |
          echo "=== GET /v1/apps/$KNOWN_APP_ID ==="
          curl -s -o /tmp/final.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            "$VIBE_URL/apps/$KNOWN_APP_ID"
          cat /tmp/final.json | jq . 2>/dev/null || cat /tmp/final.json

          APP_URL=$(jq -r '.data.appUrl // empty' /tmp/final.json 2>/dev/null \
            | grep -v '^null$' | head -1 || true)
          HANDLER=$(jq -r '.data.handlerUrl // empty' /tmp/final.json 2>/dev/null | head -1 || true)
          CLIENT_ID=$(jq -r '.data.bitrixClientId // empty' /tmp/final.json 2>/dev/null | head -1 || true)
          PREFIX=$(jq -r '.data.prefix // empty' /tmp/final.json 2>/dev/null | head -1 || true)
          SUFFIX=$(jq -r '.data.suffix // empty' /tmp/final.json 2>/dev/null | head -1 || true)

          echo "app_url=$APP_URL"       >> $GITHUB_OUTPUT
          echo "handler=$HANDLER"       >> $GITHUB_OUTPUT
          echo "client_id=$CLIENT_ID"   >> $GITHUB_OUTPUT
          echo "prefix=$PREFIX"         >> $GITHUB_OUTPUT
          echo "suffix=$SUFFIX"         >> $GITHUB_OUTPUT

      # ── Package backend (artifact) ────────────────────────────────────────
      - name: Package backend artifact
        run: |
          sudo apt-get install -y zip -q
          mkdir -p _pkg
          cp -r backend/dist   _pkg/
          cp -r backend/public _pkg/ 2>/dev/null || true
          cp backend/package.json _pkg/
          cp backend/package-lock.json _pkg/ 2>/dev/null || true
          cd _pkg && npm install --omit=dev && cd ..
          zip -r ork-backend.zip _pkg -q
          echo "Backend zip: $(du -sh ork-backend.zip | cut -f1)"

      - name: Upload backend artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ork-backend-${{ github.sha }}
          path: ork-backend.zip
          retention-days: 30

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          PAGES_URL:    ${{ steps.pages.outputs.pages_url }}
          VIBECODE_URL: ${{ steps.final.outputs.app_url }}
          HANDLER:      ${{ steps.final.outputs.handler }}
          CLIENT_ID:    ${{ steps.final.outputs.client_id }}
          PREFIX:       ${{ steps.final.outputs.prefix }}
          SUFFIX:       ${{ steps.final.outputs.suffix }}
        run: |
          # Best URL for Bitrix24 placement:
          # 1. appUrl (if Vibecode accepted it) 2. Pages URL 3. handlerUrl
          FINAL_URL="${VIBECODE_URL:-${PAGES_URL:-$HANDLER}}"

          echo "================================================================"
          echo "  ORK Reports — Deploy Summary"
          echo "================================================================"
          echo "  GitHub Pages    : $PAGES_URL"
          echo "  Vibecode appUrl : ${VIBECODE_URL:-<null>}"
          echo "  handlerUrl      : $HANDLER"
          echo "  bitrixClientId  : $CLIENT_ID"
          echo "  prefix / suffix : $PREFIX / $SUFFIX"
          echo "  → Best URL      : $FINAL_URL"
          echo "================================================================"
          echo ""
          echo "Backend artifact: ork-backend-*.zip (deploy separately on"
          echo "Render / Railway / Fly.io for hour corrections storage)"
          echo ""
          echo "Встройка в левое меню Битрикс24 (выполнить в BX24 Dev Tools):"
          echo ""
          echo "  BX24.callMethod('placement.bind', {"
          echo "    PLACEMENT: 'APPLICATION_LEFT_MENU',"
          echo "    HANDLER:   '$FINAL_URL',"
          echo "    LANG_ALL:  { ru: { NAME: 'ОРК — Отчёты' } }"
          echo "  }, console.log);"
          echo ""
          echo "Установка Bitrix24 local app:"
          echo "  bitrixClientId: $CLIENT_ID"
          echo "  Зайдите: Битрикс24 → Разработчикам → Локальные приложения"
          echo "  Найдите приложение с Client ID: $CLIENT_ID"
