name: Deploy to Vibecode

on:
  push:
    branches: [claude/stoic-brahmagupta-1de51x, main]
  workflow_dispatch:

env:
  VIBE_KEY: ${{ secrets.VIBE_API_KEY || 'vibe_api_wXJ94h3wA502Vmsw2ksXZTraKgElqItx_599bd9' }}
  VIBE_API_URL: https://vibecode.bitrix24.tech/v1
  EXEC_URL: https://vibecode.bitrix24.tech/v1/infra/servers/5b93084a-2124-4a42-a589-52c27075da3f/exec
  APP_SERVER: https://app-7ef23f885c9b.vibecode.bitrix24.tech
  APP_ID: b6e86834-8b84-42c4-be4b-2bd2b092aa91
  APP_NAME: ork-reports
  REPO: mezhevikinoff-alt/B24
  BRANCH: main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Build backend
        working-directory: backend
        run: npm install && npm run build

      - name: Package
        run: |
          sudo apt-get install -y zip -q
          mkdir -p _pkg
          cp -r backend/dist    _pkg/
          cp -r backend/public  _pkg/ 2>/dev/null || true
          cp backend/package.json _pkg/
          cp backend/package-lock.json _pkg/ 2>/dev/null || true
          cd _pkg && npm install --omit=dev && cd ..
          tar czf ork-reports.tar.gz -C _pkg .
          echo "Archive size: $(du -sh ork-reports.tar.gz | cut -f1)"

      # ── Probe exec endpoint ───────────────────────────────────────────────
      - name: Probe exec endpoint
        run: |
          echo "=== Probing exec endpoint: $EXEC_URL ==="
          for BODY in \
            '{"command":"echo hello"}' \
            '{"cmd":"echo hello"}' \
            '{"script":"echo hello"}' \
            '{"run":"echo hello"}'; do
            CODE=$(curl -s -w "%{http_code}" -X POST \
              -o /tmp/probe_exec.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "$EXEC_URL" 2>/dev/null || echo "000")
            echo "  $BODY  →  HTTP $CODE  |  $(cat /tmp/probe_exec.json 2>/dev/null || true)"
          done

      # ── Deploy via exec API ───────────────────────────────────────────────
      - name: Deploy via exec — git pull + build + restart
        id: deploy_exec
        run: |
          echo "=== Deploy via exec API ==="

          DEPLOY_CMD="set -e
            APP_DIR=\${APP_DIR:-/home/app/ork-reports}
            echo Working dir: \$APP_DIR
            if [ -d \"\$APP_DIR/.git\" ]; then
              cd \"\$APP_DIR\" && git fetch origin && git reset --hard origin/main
            else
              mkdir -p \"\$(dirname \$APP_DIR)\"
              git clone https://github.com/mezhevikinoff-alt/B24.git \"\$APP_DIR\"
              cd \"\$APP_DIR\"
            fi
            cd frontend && npm install --silent && npm run build && cd ..
            cd backend  && npm install --silent && npm run build && cd ..
            if command -v pm2 >/dev/null 2>&1; then
              pm2 describe ork-reports >/dev/null 2>&1 && pm2 restart ork-reports || pm2 start backend/dist/server.js --name ork-reports
            fi
            echo DEPLOY_DONE"

          DEPLOYED=false
          for KEY in command cmd script run; do
            PAYLOAD=$(jq -n --arg k "$KEY" --arg v "$DEPLOY_CMD" '{($k): $v}')
            CODE=$(curl -s -w "%{http_code}" -X POST \
              -o /tmp/exec_${KEY}.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$EXEC_URL" 2>/dev/null || echo "000")
            RESP=$(cat /tmp/exec_${KEY}.json 2>/dev/null || true)
            echo "key=$KEY  HTTP $CODE  |  $RESP"
            if [[ "$CODE" -ge 200 && "$CODE" -lt 300 ]]; then
              DEPLOYED=true
              echo "deployed=$DEPLOYED" >> $GITHUB_OUTPUT
              echo "deploy_code=$CODE"  >> $GITHUB_OUTPUT
              break
            fi
          done

          if [ "$DEPLOYED" = false ]; then
            echo "deployed=false" >> $GITHUB_OUTPUT
            echo "deploy_code=0"  >> $GITHUB_OUTPUT
          fi

      # ── Upload pre-built archive via exec (base64) ────────────────────────
      - name: Deploy via exec — upload pre-built archive
        id: deploy_upload
        if: steps.deploy_exec.outputs.deployed != 'true'
        run: |
          echo "=== Fallback: send pre-built archive via exec (base64) ==="

          B64=$(base64 -w 0 ork-reports.tar.gz)
          UPLOAD_CMD="echo '${B64}' | base64 -d > /tmp/ork-reports.tar.gz
            mkdir -p /home/app/ork-reports
            tar xzf /tmp/ork-reports.tar.gz -C /home/app/ork-reports
            cd /home/app/ork-reports
            npm install --omit=dev --silent
            pm2 describe ork-reports >/dev/null 2>&1 && pm2 restart ork-reports || pm2 start dist/server.js --name ork-reports
            echo UPLOAD_DONE"

          for KEY in command cmd script run; do
            PAYLOAD=$(jq -n --arg k "$KEY" --arg v "$UPLOAD_CMD" '{($k): $v}')
            CODE=$(curl -s -w "%{http_code}" -X POST \
              -o /tmp/upload_${KEY}.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$EXEC_URL" 2>/dev/null || echo "000")
            echo "key=$KEY  HTTP $CODE  |  $(cat /tmp/upload_${KEY}.json 2>/dev/null || true)"
            if [[ "$CODE" -ge 200 && "$CODE" -lt 300 ]]; then
              echo "uploaded=true" >> $GITHUB_OUTPUT
              break
            fi
          done

      # ── PATCH appUrl on Vibecode management API ───────────────────────────
      - name: Set appUrl on Vibecode API
        id: set_url
        run: |
          echo "=== PATCH $VIBE_API_URL/apps/$APP_ID ==="
          CODE=$(curl -s -w "%{http_code}" -X PATCH \
            -o /tmp/patch_url.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"appUrl\":\"$APP_SERVER\"}" \
            "$VIBE_API_URL/apps/$APP_ID")
          echo "HTTP $CODE | $(cat /tmp/patch_url.json | jq . 2>/dev/null || cat /tmp/patch_url.json)"

          APP_URL=$(jq -r '.data.appUrl // empty' /tmp/patch_url.json 2>/dev/null \
            | grep -v '^null$' | head -1 || true)
          echo "app_url=${APP_URL:-$APP_SERVER}" >> $GITHUB_OUTPUT

      # ── Deploy frontend to GitHub Pages (static fallback) ─────────────────
      - name: Deploy frontend to GitHub Pages
        id: pages
        continue-on-error: true
        run: |
          mkdir -p /tmp/gh-pages
          cp -r backend/public/. /tmp/gh-pages/
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          cd /tmp/gh-pages
          git init && git checkout -b gh-pages
          git add -A
          git commit -m "Deploy ORK frontend"
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin gh-pages --force
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "pages_url=$PAGES_URL" >> $GITHUB_OUTPUT
          echo "GitHub Pages: $PAGES_URL"

      # ── Artifact ──────────────────────────────────────────────────────────
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ork-reports-${{ github.sha }}
          path: ork-reports.tar.gz
          retention-days: 30

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          DEPLOYED:  ${{ steps.deploy_exec.outputs.deployed }}
          APP_URL:   ${{ steps.set_url.outputs.app_url }}
          PAGES_URL: ${{ steps.pages.outputs.pages_url }}
        run: |
          FINAL_URL="${APP_URL:-$APP_SERVER}"

          echo "================================================================"
          echo "  ОРК Отчёты — Deploy Summary"
          echo "================================================================"
          echo "  Exec deploy OK     : ${DEPLOYED:-false}"
          echo "  App server         : $APP_SERVER"
          echo "  appUrl (Vibecode)  : ${APP_URL:-<не установлен>}"
          echo "  GitHub Pages       : ${PAGES_URL:-<не задеплоен>}"
          echo "================================================================"
          echo ""
          echo "Встройка в левое меню Битрикс24:"
          echo ""
          echo "  BX24.callMethod('placement.bind', {"
          echo "    PLACEMENT: 'APPLICATION_LEFT_MENU',"
          echo "    HANDLER:   '$FINAL_URL',"
          echo "    LANG_ALL:  { ru: { NAME: 'ОРК — Отчёты' } }"
          echo "  }, console.log);"
