name: Deploy to Vibecode

on:
  push:
    branches: [claude/stoic-brahmagupta-1de51x, main]
  workflow_dispatch:

env:
  VIBE_KEY: ${{ secrets.VIBE_API_KEY || 'vibe_api_wXJ94h3wA502Vmsw2ksXZTraKgElqItx_599bd9' }}
  VIBE_URL: https://vibecode.bitrix24.tech/v1
  APP_NAME: ork-reports

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build
      - name: Build backend
        working-directory: backend
        run: npm install && npm run build
      - name: Package app
        id: package
        run: |
          mkdir -p _pkg
          cp -r backend/dist  _pkg/
          cp -r backend/public _pkg/ 2>/dev/null || true
          cp backend/package.json _pkg/
          cp backend/package-lock.json _pkg/ 2>/dev/null || true
          cp vibecode.json _pkg/
          # production deps only
          cd _pkg && npm install --omit=dev && cd ..
          tar czf ork-reports.tar.gz -C _pkg .
          SIZE=$(du -sh ork-reports.tar.gz | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "::notice::Archive: $SIZE"

      # ── Find or create app via GET + POST /v1/apps ────────────────────────
      - name: Find existing app
        id: find
        run: |
          RESP=$(curl -sf \
            -H "Authorization: Bearer $VIBE_KEY" \
            "$VIBE_URL/apps")
          echo "GET /v1/apps → $RESP"

          APP_ID=$(echo "$RESP" | jq -r --arg n "$APP_NAME" \
            '.data[] | select(.name == $n) | .id // empty' 2>/dev/null | head -1 || echo "")
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "Existing app_id: '$APP_ID'"

      - name: Create app (if not exists)
        id: create
        if: steps.find.outputs.app_id == ''
        run: |
          echo "=== Creating app via POST /v1/apps ==="

          # Attempt 1: JSON body
          RESP=$(curl -si -X POST \
            -H "Authorization: Bearer $VIBE_KEY" \
            -H "Content-Type: application/json" \
            -d @vibecode.json \
            "$VIBE_URL/apps")
          HTTP_CODE=$(echo "$RESP" | grep -i "^HTTP" | tail -1 | awk '{print $2}')
          BODY=$(echo "$RESP" | sed '/^\r$/q' | tail -1; echo "$RESP" | awk '/^\r$/{found=1; next} found{print}')
          echo "HTTP $HTTP_CODE — Body: $BODY"

          APP_ID=$(echo "$BODY" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('id', d.get('data',{}).get('id','')))" \
            2>/dev/null || echo "")

          # Attempt 2: multipart with archive
          if [ -z "$APP_ID" ]; then
            echo "JSON create gave no ID, trying multipart..."
            RESP2=$(curl -si -X POST \
              -H "Authorization: Bearer $VIBE_KEY" \
              -F "name=$APP_NAME" \
              -F "runtime=nodejs20" \
              -F "entrypoint=dist/server.js" \
              -F "file=@ork-reports.tar.gz;type=application/gzip" \
              "$VIBE_URL/apps")
            HTTP_CODE2=$(echo "$RESP2" | grep -i "^HTTP" | tail -1 | awk '{print $2}')
            BODY2=$(echo "$RESP2" | awk 'BEGIN{h=1} /^\r?$/{if(h){h=0;next}} !h{print}')
            echo "HTTP $HTTP_CODE2 — Body: $BODY2"
            APP_ID=$(echo "$BODY2" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('id', d.get('data',{}).get('id','')))" \
              2>/dev/null || echo "")
          fi

          # Attempt 3: re-read app list (maybe 201 returns empty body but creates the app)
          if [ -z "$APP_ID" ]; then
            echo "Checking if app was created silently..."
            sleep 2
            RESP3=$(curl -sf \
              -H "Authorization: Bearer $VIBE_KEY" \
              "$VIBE_URL/apps")
            APP_ID=$(echo "$RESP3" | jq -r --arg n "$APP_NAME" \
              '.data[] | select(.name == $n) | .id // empty' 2>/dev/null | head -1 || echo "")
            echo "After create, app_id from list: '$APP_ID'"
          fi

          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "Final app_id: '$APP_ID'"

      # ── Resolve app ID ────────────────────────────────────────────────────
      - name: Resolve app ID
        id: app
        run: |
          APP_ID="${{ steps.find.outputs.app_id }}"
          if [ -z "$APP_ID" ]; then
            APP_ID="${{ steps.create.outputs.app_id }}"
          fi
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "::notice::App ID: $APP_ID"

      # ── Deploy / update via /v1/apps endpoints ────────────────────────────
      - name: Deploy — PUT /v1/apps/{id} with archive
        id: deploy_put
        if: steps.app.outputs.app_id != ''
        continue-on-error: true
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          echo "=== PUT /v1/apps/$APP_ID (multipart archive) ==="
          RESP=$(curl -si -X PUT \
            -H "Authorization: Bearer $VIBE_KEY" \
            -F "file=@ork-reports.tar.gz;type=application/gzip" \
            "$VIBE_URL/apps/$APP_ID")
          echo "$RESP"
          HTTP_CODE=$(echo "$RESP" | grep -i "^HTTP" | tail -1 | awk '{print $2}')
          echo "HTTP $HTTP_CODE"
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] && echo "put_ok=true" >> $GITHUB_OUTPUT || true

      - name: Deploy — PATCH /v1/apps/{id} with archive
        id: deploy_patch
        if: steps.app.outputs.app_id != '' && steps.deploy_put.outputs.put_ok != 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          echo "=== PATCH /v1/apps/$APP_ID ==="
          RESP=$(curl -si -X PATCH \
            -H "Authorization: Bearer $VIBE_KEY" \
            -F "file=@ork-reports.tar.gz;type=application/gzip" \
            "$VIBE_URL/apps/$APP_ID")
          echo "$RESP"

      - name: Deploy — POST /v1/apps/{id} (redeploy)
        if: steps.app.outputs.app_id != ''
        continue-on-error: true
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          echo "=== POST /v1/apps/$APP_ID (redeploy trigger) ==="
          RESP=$(curl -si -X POST \
            -H "Authorization: Bearer $VIBE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"action":"deploy"}' \
            "$VIBE_URL/apps/$APP_ID")
          echo "$RESP"

      # ── Sub-path scan (to discover deploy/upload endpoints) ──────────────
      - name: Scan sub-paths on app
        if: steps.app.outputs.app_id != ''
        continue-on-error: true
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          echo "=== Scanning sub-paths for /v1/apps/$APP_ID ==="
          for SUB in deploy upload files archive start restart logs status release publish build; do
            for METHOD in GET POST PUT; do
              CODE=$(curl -so /dev/null -w "%{http_code}" -X "$METHOD" \
                -H "Authorization: Bearer $VIBE_KEY" \
                -H "Content-Type: application/json" \
                -d '{}' \
                "$VIBE_URL/apps/$APP_ID/$SUB")
              [ "$CODE" != "404" ] && echo "  ✅ $METHOD /v1/apps/$APP_ID/$SUB  →  HTTP $CODE"
            done
          done

      # ── Final state ───────────────────────────────────────────────────────
      - name: Final app state
        if: steps.app.outputs.app_id != ''
        run: |
          echo "=== GET /v1/apps/${{ steps.app.outputs.app_id }} ==="
          curl -sf \
            -H "Authorization: Bearer $VIBE_KEY" \
            "$VIBE_URL/apps/${{ steps.app.outputs.app_id }}" \
            | python3 -m json.tool || true

      # ── Artifact (всегда доступен для ручного деплоя) ─────────────────────
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ork-reports-${{ github.sha }}
          path: ork-reports.tar.gz
          retention-days: 14

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "  ORK Reports — Deploy Summary"
          echo "============================================"
          echo "  Archive : ork-reports.tar.gz (${{ steps.package.outputs.size }})"
          echo "  App ID  : ${{ steps.app.outputs.app_id }}"
          echo "============================================"
