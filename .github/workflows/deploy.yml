name: Deploy to Vibecode

on:
  push:
    branches: [claude/stoic-brahmagupta-1de51x, main]
  workflow_dispatch:

env:
  VIBE_KEY: ${{ secrets.VIBE_API_KEY || 'vibe_api_wXJ94h3wA502Vmsw2ksXZTraKgElqItx_599bd9' }}
  VIBE_URL: https://vibecode.bitrix24.tech/v1
  APP_NAME: ork-reports
  KNOWN_APP_ID: b6e86834-8b84-42c4-be4b-2bd2b092aa91

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Build backend
        working-directory: backend
        run: npm install && npm run build

      - name: Package app
        id: package
        run: |
          sudo apt-get install -y zip -q
          mkdir -p _pkg
          cp -r backend/dist   _pkg/
          cp -r backend/public _pkg/ 2>/dev/null || true
          cp backend/package.json _pkg/
          cp backend/package-lock.json _pkg/ 2>/dev/null || true
          cd _pkg && npm install --omit=dev && cd ..
          tar czf ork-reports.tar.gz -C _pkg .
          zip -r ork-reports.zip _pkg -q
          echo "size=$(du -sh ork-reports.tar.gz | cut -f1)" >> $GITHUB_OUTPUT
          echo "::notice::Archive: $(du -sh ork-reports.tar.gz | cut -f1)"

      # ── Verify app still exists ───────────────────────────────────────────
      - name: Verify / recreate app
        id: app
        run: |
          APP_ID="$KNOWN_APP_ID"
          echo "=== GET /v1/apps/$APP_ID ==="
          CODE=$(curl -s -w "%{http_code}" -o /tmp/app.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            "$VIBE_URL/apps/$APP_ID")
          echo "HTTP $CODE"
          cat /tmp/app.json | jq . 2>/dev/null || cat /tmp/app.json

          if [ "$CODE" = "404" ] || [ "$CODE" = "000" ]; then
            echo "::warning::App not found, recreating..."
            curl -s -w "%{http_code}" -X POST \
              -o /tmp/create.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"ORK Reports\",\"name\":\"$APP_NAME\",\"runtime\":\"nodejs20\",\"entrypoint\":\"dist/server.js\",\"scopes\":[\"crm\",\"timeman\",\"user\",\"placement\"]}" \
              "$VIBE_URL/apps"
            cat /tmp/create.json
            APP_ID=$(jq -r '.id // .data.id // empty' /tmp/create.json 2>/dev/null | head -1 || true)
          fi

          # Save known fields
          PREFIX=$(jq -r '.data.prefix // empty' /tmp/app.json 2>/dev/null | head -1 || true)
          SUFFIX=$(jq -r '.data.suffix // empty' /tmp/app.json 2>/dev/null | head -1 || true)
          HANDLER=$(jq -r '.data.handlerUrl // empty' /tmp/app.json 2>/dev/null | head -1 || true)
          CLIENT_ID=$(jq -r '.data.bitrixClientId // empty' /tmp/app.json 2>/dev/null | head -1 || true)

          echo "app_id=$APP_ID"            >> $GITHUB_OUTPUT
          echo "prefix=$PREFIX"            >> $GITHUB_OUTPUT
          echo "suffix=$SUFFIX"            >> $GITHUB_OUTPUT
          echo "handler_url=$HANDLER"      >> $GITHUB_OUTPUT
          echo "bitrix_client_id=$CLIENT_ID" >> $GITHUB_OUTPUT
          echo "::notice::App ID: $APP_ID | prefix=$PREFIX suffix=$SUFFIX"

      # ── Upload archive (known working method: PUT tar.gz) ─────────────────
      - name: Upload archive
        id: upload
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          echo "=== PUT /v1/apps/$APP_ID (application/gzip) ==="
          CODE=$(curl -s -w "%{http_code}" -X PUT \
            -o /tmp/upload_resp.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -H "Content-Type: application/gzip" \
            --data-binary @ork-reports.tar.gz \
            "$VIBE_URL/apps/$APP_ID")
          echo "HTTP $CODE | $(cat /tmp/upload_resp.json)"
          echo "upload_code=$CODE" >> $GITHUB_OUTPUT
          echo "::notice::Upload HTTP $CODE"

      # ── Try to start / activate the app ──────────────────────────────────
      - name: Start app (trigger activation)
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          echo "=== Trying to start/activate app after upload ==="

          # PATCH with status variants
          for STATUS in active running deployed started; do
            CODE=$(curl -s -w "%{http_code}" -X PATCH \
              -o /tmp/start_$STATUS.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"$STATUS\"}" \
              "$VIBE_URL/apps/$APP_ID")
            echo "PATCH status=$STATUS → HTTP $CODE | $(cat /tmp/start_$STATUS.json)"
          done

          # POST with action variants
          for ACTION in start deploy activate publish restart; do
            CODE=$(curl -s -w "%{http_code}" -X POST \
              -o /tmp/action_$ACTION.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"action\":\"$ACTION\"}" \
              "$VIBE_URL/apps/$APP_ID")
            echo "POST action=$ACTION → HTTP $CODE | $(cat /tmp/action_$ACTION.json)"
          done

          # PUT with deploy flag
          CODE=$(curl -s -w "%{http_code}" -X PUT \
            -o /tmp/put_deploy.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"deploy":true}' \
            "$VIBE_URL/apps/$APP_ID")
          echo "PUT deploy=true → HTTP $CODE | $(cat /tmp/put_deploy.json)"

      # ── Poll appUrl (up to 90s) ───────────────────────────────────────────
      - name: Poll for appUrl
        id: url
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          APP_URL=""
          echo "=== Polling /v1/apps/$APP_ID for appUrl (6×15s) ==="
          for i in 1 2 3 4 5 6; do
            sleep 15
            curl -s -o /tmp/poll_$i.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              "$VIBE_URL/apps/$APP_ID"

            APP_URL=$(jq -r '.data.appUrl // .data.url // .data.domain // .data.endpoint // empty' \
              /tmp/poll_$i.json 2>/dev/null | grep -v '^null$' | head -1 || true)
            STATUS=$(jq -r '.data.status // .data.state // empty' \
              /tmp/poll_$i.json 2>/dev/null | head -1 || true)
            echo "  [attempt $i] appUrl=$APP_URL  status=$STATUS"

            if [ -n "$APP_URL" ] && [ "$APP_URL" != "null" ]; then
              echo "::notice::appUrl resolved: $APP_URL"
              break
            fi
          done

          # Dump final full state
          echo "=== Final app state ==="
          cat /tmp/poll_6.json | jq . 2>/dev/null || cat /tmp/poll_6.json

          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

      # ── Try to derive URL from prefix/suffix ─────────────────────────────
      - name: Derive URL from prefix/suffix
        id: derived
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
          PREFIX: ${{ steps.app.outputs.prefix }}
          SUFFIX: ${{ steps.app.outputs.suffix }}
          APP_URL: ${{ steps.url.outputs.app_url }}
        run: |
          if [ -n "$APP_URL" ] && [ "$APP_URL" != "null" ]; then
            echo "appUrl already known: $APP_URL"
            echo "guessed_url=$APP_URL" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "=== Guessing URL from prefix=$PREFIX suffix=$SUFFIX ==="
          CANDIDATES=(
            "https://${PREFIX}-${SUFFIX}.vibecode.bitrix24.tech"
            "https://${APP_ID}.vibecode.bitrix24.tech"
            "https://${APP_NAME}.vibecode.bitrix24.tech"
            "https://${PREFIX}.vibecode.bitrix24.tech"
          )

          GUESSED=""
          for URL in "${CANDIDATES[@]}"; do
            CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 5 "$URL" 2>/dev/null || echo "000")
            echo "  $URL → HTTP $CODE"
            if [ "$CODE" != "000" ] && [ "$CODE" != "404" ]; then
              GUESSED="$URL"
              echo "::notice::Guessed URL accessible: $URL (HTTP $CODE)"
              break
            fi
          done

          echo "guessed_url=$GUESSED" >> $GITHUB_OUTPUT

      # ── Artifact ─────────────────────────────────────────────────────────
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ork-reports-${{ github.sha }}
          path: ork-reports.tar.gz
          retention-days: 14

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
          HANDLER: ${{ steps.app.outputs.handler_url }}
          CLIENT_ID: ${{ steps.app.outputs.bitrix_client_id }}
          APP_URL: ${{ steps.url.outputs.app_url }}
          GUESSED: ${{ steps.derived.outputs.guessed_url }}
        run: |
          FINAL_URL="${APP_URL:-${GUESSED:-$HANDLER}}"

          echo "================================================"
          echo "  ORK Reports — Deploy Summary"
          echo "================================================"
          echo "  App ID         : $APP_ID"
          echo "  Upload HTTP    : ${{ steps.upload.outputs.upload_code }}"
          echo "  appUrl         : ${APP_URL:-<null>}"
          echo "  Guessed URL    : ${GUESSED:-<none>}"
          echo "  handlerUrl     : $HANDLER"
          echo "  bitrixClientId : $CLIENT_ID"
          echo "  → Use for Bitrix24: $FINAL_URL"
          echo "================================================"
          echo ""
          echo "Встройка в левое меню Битрикс24:"
          echo "  BX24.callMethod('placement.bind', {"
          echo "    PLACEMENT: 'APPLICATION_LEFT_MENU',"
          echo "    HANDLER:   '$FINAL_URL',"
          echo "    LANG_ALL:  { ru: { NAME: 'ОРК — Отчёты' } }"
          echo "  }, console.log);"
          echo ""
          echo "  bitrixClientId для установки приложения: $CLIENT_ID"
