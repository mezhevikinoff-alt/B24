name: Deploy to Vibecode

on:
  push:
    branches: [claude/stoic-brahmagupta-1de51x, main]
  workflow_dispatch:

env:
  VIBE_KEY:       ${{ secrets.VIBE_API_KEY || 'vibe_api_wXJ94h3wA502Vmsw2ksXZTraKgElqItx_599bd9' }}
  VIBE_INFRA_KEY: ${{ secrets.VIBE_INFRA_KEY }}
  DEPLOY_URL:     https://vibecode.bitrix24.tech/v1/infra/servers/85110525-94ea-40a1-a611-d9dc9a7dd00d/deploy
  VIBE_API_URL:   https://vibecode.bitrix24.tech/v1
  APP_SERVER:     https://app-214265deb83b.vibecode.bitrix24.tech
  APP_ID:         b6e86834-8b84-42c4-be4b-2bd2b092aa91

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Deploy to Vibecode via /deploy API ────────────────────────────────
      - name: Deploy to Vibecode server
        id: deploy
        run: |
          SOURCE_URL="https://github.com/${{ github.repository }}/archive/refs/heads/${{ github.ref_name }}.tar.gz"
          echo "=== POST $DEPLOY_URL?stream=false ==="
          echo "Source: $SOURCE_URL"

          CODE=$(curl -s -w "%{http_code}" -X POST \
            -o /tmp/deploy.json \
            -H "Authorization: Bearer $VIBE_INFRA_KEY" \
            -H "Content-Type: application/json" \
            -H "X-Skip-Source-Snapshot: deploy from GitHub" \
            -d "$(jq -n \
              --arg url "$SOURCE_URL" \
              '{
                source: {url: $url},
                runtime: "node20",
                install: "cd B24-*/ && cd frontend && npm install && npm run build && cd ../backend && npm install && npm run build",
                start: "cd B24-*/ && node backend/dist/server.js",
                port: 3000,
                env: {NODE_ENV: "production", PORT: "3000"}
              }')" \
            "$DEPLOY_URL?stream=false")

          echo "HTTP $CODE"
          cat /tmp/deploy.json | jq . 2>/dev/null || cat /tmp/deploy.json
          echo "deploy_code=$CODE" >> $GITHUB_OUTPUT

          if [[ "$CODE" -ge 200 && "$CODE" -lt 300 ]]; then
            if [[ "$(jq -r '.success' /tmp/deploy.json 2>/dev/null)" == "true" ]]; then
              echo "deployed=true" >> $GITHUB_OUTPUT
              echo "::notice::Deployed successfully"
            else
              echo "deployed=false" >> $GITHUB_OUTPUT
              ERR=$(jq -r '.error | "\(.code): \(.message) [step: \(.step)]"' /tmp/deploy.json 2>/dev/null || true)
              echo "::error::Deploy failed — $ERR"
            fi
          else
            echo "deployed=false" >> $GITHUB_OUTPUT
            echo "::error::Deploy API HTTP $CODE"
          fi

      # ── PATCH appUrl on Vibecode management API ───────────────────────────
      - name: Set appUrl on Vibecode API
        id: set_url
        if: always()
        run: |
          CODE=$(curl -s -w "%{http_code}" -X PATCH \
            -o /tmp/patch_url.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"appUrl\":\"$APP_SERVER\"}" \
            "$VIBE_API_URL/apps/$APP_ID")
          echo "PATCH appUrl → HTTP $CODE"
          APP_URL=$(jq -r '.data.appUrl // empty' /tmp/patch_url.json 2>/dev/null | grep -v '^null$' | head -1 || true)
          echo "app_url=${APP_URL:-$APP_SERVER}" >> $GITHUB_OUTPUT

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          DEPLOYED:  ${{ steps.deploy.outputs.deployed }}
          HTTP_CODE: ${{ steps.deploy.outputs.deploy_code }}
          APP_URL:   ${{ steps.set_url.outputs.app_url }}
        run: |
          FINAL_URL="${APP_URL:-$APP_SERVER}"
          echo "================================================================"
          echo "  ОРК Отчёты — Deploy Summary"
          echo "================================================================"
          echo "  Deploy status  : ${DEPLOYED:-false} (HTTP ${HTTP_CODE:-?})"
          echo "  App server     : $APP_SERVER"
          echo "  appUrl         : ${APP_URL:-<не установлен>}"
          echo "================================================================"
          echo ""
          echo "Встройка в левое меню Битрикс24:"
          echo "  BX24.callMethod('placement.bind', {"
          echo "    PLACEMENT: 'APPLICATION_LEFT_MENU',"
          echo "    HANDLER:   '$FINAL_URL',"
          echo "    LANG_ALL:  { ru: { NAME: 'ОРК — Отчёты' } }"
          echo "  }, console.log);"
