name: Deploy to Vibecode

on:
  push:
    branches: [claude/stoic-brahmagupta-1de51x, main]
  workflow_dispatch:

env:
  VIBE_KEY: ${{ secrets.VIBE_API_KEY || 'vibe_api_wXJ94h3wA502Vmsw2ksXZTraKgElqItx_599bd9' }}
  VIBE_API_URL: https://vibecode.bitrix24.tech/v1
  APP_SERVER:   https://app-7ef23f885c9b.vibecode.bitrix24.tech
  APP_ID:       b6e86834-8b84-42c4-be4b-2bd2b092aa91
  APP_NAME:     ork-reports

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Build backend
        working-directory: backend
        run: npm install && npm run build

      - name: Package
        id: package
        run: |
          sudo apt-get install -y zip -q
          mkdir -p _pkg
          cp -r backend/dist   _pkg/
          cp -r backend/public _pkg/ 2>/dev/null || true
          cp backend/package.json _pkg/
          cp backend/package-lock.json _pkg/ 2>/dev/null || true
          cd _pkg && npm install --omit=dev && cd ..
          tar czf ork-reports.tar.gz -C _pkg .
          zip -r ork-reports.zip _pkg -q
          echo "::notice::Archive: $(du -sh ork-reports.tar.gz | cut -f1)"

      # ── Probe app server ──────────────────────────────────────────────────
      - name: Probe app server
        run: |
          echo "=== GET $APP_SERVER/ ==="
          curl -si --max-time 10 \
            -H "Authorization: Bearer $VIBE_KEY" \
            "$APP_SERVER/" 2>&1 | head -40 || true

          echo ""
          echo "=== Scanning deploy endpoints on $APP_SERVER ==="
          for EP in "" "deploy" "upload" "api/deploy" "api/upload" "_deploy" \
                    "webhook" "hook" "push" "release" "update" "sync"; do
            URL="$APP_SERVER${EP:+/$EP}"
            for METHOD in GET POST PUT; do
              CODE=$(curl -so /dev/null -w "%{http_code}" --max-time 8 \
                -X "$METHOD" \
                -H "Authorization: Bearer $VIBE_KEY" \
                -H "Content-Type: application/json" \
                -d '{}' \
                "$URL" 2>/dev/null || echo "000")
              if [ "$CODE" != "404" ] && [ "$CODE" != "000" ]; then
                echo "  ✅ $METHOD $URL → HTTP $CODE"
              fi
            done
          done

      # ── Deploy to app server ──────────────────────────────────────────────
      - name: Deploy archive to app server
        id: deploy
        run: |
          echo "=== Deploying to $APP_SERVER ==="
          DEPLOYED=false

          # 1. POST /deploy with zip
          for EP in deploy upload api/deploy _deploy push; do
            CODE=$(curl -s -w "%{http_code}" --max-time 30 -X POST \
              -o /tmp/deploy_${EP//\//_}.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -H "Content-Type: application/zip" \
              --data-binary @ork-reports.zip \
              "$APP_SERVER/$EP" 2>/dev/null || echo "000")
            echo "POST $APP_SERVER/$EP → HTTP $CODE | $(cat /tmp/deploy_${EP//\//_}.json 2>/dev/null || true)"
            if [[ "$CODE" -ge 200 && "$CODE" -lt 300 ]]; then
              DEPLOYED=true
              echo "::notice::Deployed via POST /$EP"
              break
            fi
          done

          # 2. PUT root with zip
          if [ "$DEPLOYED" = false ]; then
            CODE=$(curl -s -w "%{http_code}" --max-time 30 -X PUT \
              -o /tmp/deploy_put_root.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -H "Content-Type: application/zip" \
              --data-binary @ork-reports.zip \
              "$APP_SERVER/" 2>/dev/null || echo "000")
            echo "PUT $APP_SERVER/ → HTTP $CODE | $(cat /tmp/deploy_put_root.json 2>/dev/null || true)"
            [[ "$CODE" -ge 200 && "$CODE" -lt 300 ]] && DEPLOYED=true || true
          fi

          echo "deployed=$DEPLOYED" >> $GITHUB_OUTPUT
          echo "::notice::Deploy result: $DEPLOYED"

      # ── Update appUrl on Vibecode API ─────────────────────────────────────
      - name: Set appUrl on Vibecode API
        id: set_url
        run: |
          echo "=== PATCH $VIBE_API_URL/apps/$APP_ID — set appUrl ==="
          CODE=$(curl -s -w "%{http_code}" -X PATCH \
            -o /tmp/patch_url.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"appUrl\":\"$APP_SERVER\"}" \
            "$VIBE_API_URL/apps/$APP_ID")
          echo "HTTP $CODE | $(cat /tmp/patch_url.json | jq . 2>/dev/null || cat /tmp/patch_url.json)"

          # Check if appUrl was set
          APP_URL=$(jq -r '.data.appUrl // empty' /tmp/patch_url.json 2>/dev/null \
            | grep -v '^null$' | head -1 || true)
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

          echo ""
          echo "=== GET $VIBE_API_URL/apps/$APP_ID — final state ==="
          curl -s \
            -H "Authorization: Bearer $VIBE_KEY" \
            "$VIBE_API_URL/apps/$APP_ID" | jq . 2>/dev/null || true

      # ── Deploy frontend to GitHub Pages (fallback) ────────────────────────
      - name: Deploy frontend to GitHub Pages
        id: pages
        continue-on-error: true
        run: |
          mkdir -p /tmp/gh-pages
          cp -r backend/public/. /tmp/gh-pages/
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          cd /tmp/gh-pages
          git init && git checkout -b gh-pages
          git add -A
          git commit -m "Deploy ORK frontend"
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin gh-pages --force
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "pages_url=$PAGES_URL" >> $GITHUB_OUTPUT
          echo "::notice::GitHub Pages: $PAGES_URL"

      # ── Artifact ─────────────────────────────────────────────────────────
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ork-reports-${{ github.sha }}
          path: ork-reports.zip
          retention-days: 30

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          DEPLOYED:  ${{ steps.deploy.outputs.deployed }}
          APP_URL:   ${{ steps.set_url.outputs.app_url }}
          PAGES_URL: ${{ steps.pages.outputs.pages_url }}
        run: |
          FINAL_URL="${APP_URL:-${APP_SERVER}}"

          echo "================================================================"
          echo "  ОРК Отчёты — Deploy Summary"
          echo "================================================================"
          echo "  Deployed to server : $DEPLOYED"
          echo "  App server         : $APP_SERVER"
          echo "  appUrl (Vibecode)  : ${APP_URL:-<не установлен>}"
          echo "  GitHub Pages       : ${PAGES_URL:-<не задеплоен>}"
          echo "================================================================"
          echo ""
          echo "Встройка в левое меню Битрикс24:"
          echo ""
          echo "  BX24.callMethod('placement.bind', {"
          echo "    PLACEMENT: 'APPLICATION_LEFT_MENU',"
          echo "    HANDLER:   '$FINAL_URL',"
          echo "    LANG_ALL:  { ru: { NAME: 'ОРК — Отчёты' } }"
          echo "  }, console.log);"
