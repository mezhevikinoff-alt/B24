name: Deploy to Vibecode

on:
  push:
    branches: [claude/stoic-brahmagupta-1de51x, main]
  workflow_dispatch:

env:
  VIBE_KEY: ${{ secrets.VIBE_API_KEY || 'vibe_api_wXJ94h3wA502Vmsw2ksXZTraKgElqItx_599bd9' }}
  VIBE_URL: https://vibecode.bitrix24.tech/v1
  APP_NAME: ork-reports

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Build backend
        working-directory: backend
        run: npm install && npm run build

      - name: Package app
        id: package
        run: |
          mkdir -p _pkg
          cp -r backend/dist   _pkg/
          cp -r backend/public _pkg/ 2>/dev/null || true
          cp backend/package.json _pkg/
          cp backend/package-lock.json _pkg/ 2>/dev/null || true
          cp vibecode.json _pkg/
          cd _pkg && npm install --omit=dev && cd ..
          tar czf ork-reports.tar.gz -C _pkg .
          SIZE=$(du -sh ork-reports.tar.gz | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "::notice::Archive ready: $SIZE"

      # ── Find or create app ────────────────────────────────────────────────
      - name: Find or create app
        id: app
        run: |
          # ── 1. GET list ──────────────────────────────────────────────────
          echo "=== GET /v1/apps ==="
          HTTP=$(curl -s -w "\n%{http_code}" \
            -o /tmp/apps_list.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            "$VIBE_URL/apps")
          CODE=$(echo "$HTTP" | tail -1)
          echo "HTTP $CODE"
          cat /tmp/apps_list.json | jq . 2>/dev/null || cat /tmp/apps_list.json

          APP_ID=$(jq -r --arg n "$APP_NAME" \
            '.data[] | select(.name == $n) | .id // empty' \
            /tmp/apps_list.json 2>/dev/null | head -1)
          echo "Existing app_id: '$APP_ID'"

          # ── 2. Create if not found ───────────────────────────────────────
          if [ -z "$APP_ID" ]; then
            echo ""
            echo "=== POST /v1/apps — attempt 1: minimal JSON ==="
            CODE=$(curl -s -w "%{http_code}" -X POST \
              -o /tmp/create1.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$APP_NAME\",\"runtime\":\"nodejs20\",\"entrypoint\":\"dist/server.js\"}" \
              "$VIBE_URL/apps")
            echo "HTTP $CODE | $(cat /tmp/create1.json)"
            APP_ID=$(jq -r '.id // .data.id // .app.id // .result.id // empty' \
              /tmp/create1.json 2>/dev/null | head -1)
          fi

          if [ -z "$APP_ID" ]; then
            echo ""
            echo "=== POST /v1/apps — attempt 2: multipart form ==="
            CODE=$(curl -s -w "%{http_code}" -X POST \
              -o /tmp/create2.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -F "name=$APP_NAME" \
              -F "runtime=nodejs20" \
              -F "entrypoint=dist/server.js" \
              "$VIBE_URL/apps")
            echo "HTTP $CODE | $(cat /tmp/create2.json)"
            APP_ID=$(jq -r '.id // .data.id // .app.id // .result.id // empty' \
              /tmp/create2.json 2>/dev/null | head -1)
          fi

          if [ -z "$APP_ID" ]; then
            echo ""
            echo "=== POST /v1/apps — attempt 3: multipart + archive ==="
            CODE=$(curl -s -w "%{http_code}" -X POST \
              -o /tmp/create3.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              -F "name=$APP_NAME" \
              -F "runtime=nodejs20" \
              -F "entrypoint=dist/server.js" \
              -F "file=@ork-reports.tar.gz;type=application/gzip" \
              "$VIBE_URL/apps")
            echo "HTTP $CODE | $(cat /tmp/create3.json)"
            APP_ID=$(jq -r '.id // .data.id // .app.id // .result.id // empty' \
              /tmp/create3.json 2>/dev/null | head -1)
          fi

          # ── 3. Re-read list (some APIs return 201 with empty body) ───────
          if [ -z "$APP_ID" ]; then
            echo ""
            echo "=== Re-reading app list after create attempts ==="
            sleep 3
            curl -s -o /tmp/apps_retry.json \
              -H "Authorization: Bearer $VIBE_KEY" \
              "$VIBE_URL/apps"
            echo "$(cat /tmp/apps_retry.json | jq . 2>/dev/null || cat /tmp/apps_retry.json)"
            APP_ID=$(jq -r --arg n "$APP_NAME" \
              '.data[] | select(.name == $n) | .id // empty' \
              /tmp/apps_retry.json 2>/dev/null | head -1)
            echo "app_id after retry: '$APP_ID'"
          fi

          if [ -z "$APP_ID" ]; then
            echo "::error::Could not create app. API responses above show why."
            exit 1
          fi

          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "::notice::App ID resolved: $APP_ID"

      # ── Upload archive ────────────────────────────────────────────────────
      - name: Upload archive to Vibecode
        id: upload
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          echo "=== Uploading ork-reports.tar.gz to app $APP_ID ==="

          echo "--- PUT /v1/apps/$APP_ID (field: file) ---"
          CODE=$(curl -s -w "%{http_code}" -X PUT \
            -o /tmp/put1.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -F "file=@ork-reports.tar.gz;type=application/gzip" \
            "$VIBE_URL/apps/$APP_ID")
          echo "HTTP $CODE | $(cat /tmp/put1.json)"

          echo "--- PUT /v1/apps/$APP_ID (field: archive) ---"
          CODE=$(curl -s -w "%{http_code}" -X PUT \
            -o /tmp/put2.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -F "archive=@ork-reports.tar.gz;type=application/gzip" \
            "$VIBE_URL/apps/$APP_ID")
          echo "HTTP $CODE | $(cat /tmp/put2.json)"

          echo "--- PATCH /v1/apps/$APP_ID (field: file) ---"
          CODE=$(curl -s -w "%{http_code}" -X PATCH \
            -o /tmp/patch1.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -F "file=@ork-reports.tar.gz;type=application/gzip" \
            "$VIBE_URL/apps/$APP_ID")
          echo "HTTP $CODE | $(cat /tmp/patch1.json)"

          echo "--- POST /v1/apps/$APP_ID (field: file) ---"
          CODE=$(curl -s -w "%{http_code}" -X POST \
            -o /tmp/post1.json \
            -H "Authorization: Bearer $VIBE_KEY" \
            -F "file=@ork-reports.tar.gz;type=application/gzip" \
            "$VIBE_URL/apps/$APP_ID")
          echo "HTTP $CODE | $(cat /tmp/post1.json)"

      # ── Scan sub-paths to find deploy/upload endpoints ────────────────────
      - name: Scan sub-paths
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          echo "=== Sub-path scan for /v1/apps/$APP_ID ==="
          for SUB in deploy upload files bundle archive start restart publish release build; do
            for METHOD in GET POST PUT PATCH; do
              CODE=$(curl -s -w "%{http_code}" -o /tmp/scan_resp.json -X "$METHOD" \
                -H "Authorization: Bearer $VIBE_KEY" \
                -H "Content-Type: application/json" \
                -d '{}' \
                "$VIBE_URL/apps/$APP_ID/$SUB")
              if [ "$CODE" != "404" ] && [ "$CODE" != "000" ]; then
                echo "  ✅ $METHOD /v1/apps/$APP_ID/$SUB → HTTP $CODE | $(cat /tmp/scan_resp.json)"
              fi
            done
          done

      # ── Final app state ───────────────────────────────────────────────────
      - name: App state after deploy
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          echo "=== GET /v1/apps/$APP_ID ==="
          curl -s \
            -H "Authorization: Bearer $VIBE_KEY" \
            "$VIBE_URL/apps/$APP_ID" | jq . 2>/dev/null || true

      # ── Artifact (для ручного деплоя) ─────────────────────────────────────
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ork-reports-${{ github.sha }}
          path: ork-reports.tar.gz
          retention-days: 14

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "  ORK Reports — Deploy Summary"
          echo "============================================"
          echo "  Archive : ork-reports.tar.gz (${{ steps.package.outputs.size }})"
          echo "  App ID  : ${{ steps.app.outputs.app_id }}"
          echo "============================================"
